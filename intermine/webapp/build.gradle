apply plugin: 'war'

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

tasks.test.dependsOn(':intermine-testresources:buildDB')

dependencies {
    providedCompile project(':intermine-api')

    implementation 'org.directwebremoting:dwr:3.0.2-RELEASE'
    implementation group: 'org.apache.lucene', name: 'lucene-core', version: '3.0.2'
    implementation group: 'org.apache.solr', name: 'solr-solrj', version: '8.11.4'
    implementation group: 'javax.mail', name: 'mail', version: '1.4'
    implementation group: 'org.apache.struts', name: 'struts2-core', version: '6.4.0'
    implementation group: 'org.apache.struts', name: 'struts-taglib', version: '1.3.10'
    implementation group: 'org.apache.struts', name: 'struts-extras', version: '1.3.10'
    implementation group: 'org.apache.struts', name: 'struts-tiles', version: '1.3.10'
    implementation group: "javax.servlet", name: "jstl", version: "1.2"
    implementation group: 'org.apache.taglibs', name: 'taglibs-standard', version: '1.2.5'
    implementation 'commons-fileupload:commons-fileupload:1.6.0'
    implementation group: 'org.apache.httpcomponents.client5', name: 'httpclient5', version: '5.5.1'
    implementation group: 'org.apache.commons', name: 'commons-math3', version: '3.0'
    implementation 'com.github.erosb:everit-json-schema:1.14.6'
    implementation 'org.apache.oltu.oauth2:org.apache.oltu.oauth2.client:1.0.1'
    implementation 'tools.jackson.core:jackson-databind:3.0.1'
    implementation group: 'org.glassfish.jersey.media', name: 'jersey-media-json-jackson', version: '2.25'
    implementation group: 'javax.ws.rs', name: 'javax.ws.rs-api', version: '2.0.1'
    implementation group: 'org.glassfish.jersey.core', name: 'jersey-client', version: '2.25'
    implementation group: 'org.apache.jena', name: 'jena-core', version: '4.2.0'

    implementation files('libs/stringtree-json-2.0.5.jar')
    providedCompile group: 'org.apache.oltu.oauth2', name: 'org.apache.oltu.oauth2.client', version: '1.0.0'
    providedCompile group: 'org.apache.oltu.oauth2', name: 'org.apache.oltu.oauth2.common', version: '1.0.0'
    providedCompile group: 'strutstestcase', name: 'strutstestcase', version: '2.1.4-1.2-2.4'
    providedCompile group: 'javax.servlet.jsp', name: 'javax.servlet.jsp-api', version: '2.3.1'
    providedCompile group: 'org.expressme', name: 'JOpenId', version: '1.08'
    implementation group: 'org.apache.commons', name: 'commons-math3', version: '3.2'

    providedCompile 'org.bouncycastle:bcprov-jdk18on:1.82'
    runtimeOnly group: 'commons-io', name: 'commons-io', version: '2.0.1'
    runtimeOnly group: 'org.apache.commons:commons-collections4:4.5.0'
    runtimeOnly 'org.apache.commons:commons-lang3:3.19.0'
    runtimeOnly group: 'commons-codec', name: 'commons-codec', version: '1.15'
    runtimeOnly 'taglibs:string:1.1.0'
    runtimeOnly group: 'fastutil', name: 'fastutil', version: '5.0.9'
    runtimeOnly group: 'javax.xml.bind', name: 'jaxb-api', version: '2.3.1'

    testImplementation project(path: ':intermine-testresources', configuration: 'testArtifacts')
    testImplementation project(':intermine-objectstore').sourceSets.test.output
    testImplementation project(':intermine-api').sourceSets.test.output
    testImplementation group: 'org.objenesis', name: 'objenesis', version: '2.1'
    testImplementation group: 'org.easymock', name: 'easymock', version: '3.2'
    testImplementation group: 'xmlunit', name: 'xmlunit', version: '1.0'
    testImplementation group: 'javax.servlet', name: 'javax.servlet-api', version: '3.1.0'
}

tasks.register('classesJar', Jar) {
    archiveClassifier = 'classes'
    from sourceSets.main.output
}


artifacts {
    archives classesJar
}
